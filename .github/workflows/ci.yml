name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/dc-fs-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/dc-fs-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust Unit Tests (dc-fs-engine)
        run: |
          cd services/dc-fs-engine
          cargo test --verbose

      - name: Run Go Unit Tests with Race Detection (dc-gateway)
        run: |
          cd services/dc-gateway
          go test -race -v ./...

      - name: Run Go Unit Tests (dc-doc-service)
        run: |
          cd services/dc-doc-service
          go test -race -v ./...

      - name: Build & Run E2E Test Suite (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          ./build.sh
          ./tests/e2e_test.sh

      - name: Build Windows Executables
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          cd services/dc-fs-engine && cargo build --release && cd ../..
          cp services/dc-fs-engine/target/release/dc-fs-engine.exe bin/
          cd services/dc-gateway && go build -o ../../bin/dc-gateway.exe main.go && cd ../..
          cd services/dc-doc-service && go build -o ../../bin/dc-doc-service.exe main.go && cd ../..
          ls -la bin/
