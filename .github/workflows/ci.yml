name: A2M source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    name: Build and test engines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build binaries first
        run: ./build.sh

      - name: Build and run unit tests with race detection
        run: |
          cd services/dc-fs-engine && cargo test
          cd ../dc-gateway && go test -race -v ./...
          cd ../dc-doc-service && go test -race -v ./...

      - name: Validate JavaScript syntax and service health UI
        run: |
          node --check UI/a2m-desktop-v2/app.js
          node --test tests/ui_service_health.test.mjs

      - name: Run Go vet
        run: |
          cd services/dc-gateway && go vet ./...
          cd ../dc-doc-service && go vet ./...

      - name: End-to-end protocol test
        run: ./tests/e2e_test.sh

  desktop:
    name: Build native macOS desktop bundle
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build ad-hoc signed desktop and local DMG
        run: ./scripts/build_desktop.sh

      - name: Verify local bundle exists
        run: |
          test -x apps/desktop/macos/A2M.app/Contents/MacOS/A2MApp
          test -f dist/A2M-macos-arm64.dmg
          codesign --verify --deep --strict apps/desktop/macos/A2M.app

      - name: Upload ad-hoc signed developer DMG
        uses: actions/upload-artifact@v4
        with:
          name: A2M-macos-arm64-developer-preview-UNNOTARIZED
          path: dist/A2M-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
