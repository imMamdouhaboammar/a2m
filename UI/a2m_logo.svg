<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-label="A2M minimal monoline identity: an AI spark connected to a command terminal by a fluid number two cable">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
