  <!-- Primary wordmark. Lowercase and geometric to feel friendly, technical and open. -->
  <text x="600" y="540" font-family="Arial, Helvetica, sans-serif" font-size="174" font-weight="700" letter-spacing="-12" text-anchor="middle" fill="#172336">a<tspan fill="#2974FF">2</tspan>m</text>
  <text x="600" y="607" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="8" text-anchor="middle" fill="#687384">AGENT TO MACHINE</text>
</svg>
