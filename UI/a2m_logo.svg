    <path d="M416 265 C368 265 339 235 339 193 C339 151 370 121 414 121 C457 121 486 151 486 192 C486 216 477 235 461 248" stroke="#172336" stroke-width="11"/>
    <path d="M412 164 C415 182 420 188 440 192 C420 195 415 201 412 220 C408 200 402 195 384 192 C403 189 409 183 412 164Z" fill="#2974FF" stroke="none"/>
    <!-- A single expressive connection line shaped like the numeral 2 -->
    <path d="M483 174 C510 134 554 126 589 148 C631 176 610 207 569 239 C535 265 523 282 538 296 C550 310 582 308 620 308" stroke="#2974FF" stroke-width="12"/>
